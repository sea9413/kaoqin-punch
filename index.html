<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 手机友好：自适应缩放，把刘海屏安全区算进去 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>团队打卡 · 小团队考勤</title>
<!-- supabase-js 从 CDN 引入，浏览器里会挂到 window.supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- 备用 CDN：jsdelivr 挂了就换 unpkg（国内偶发不稳），避免整站变白 -->
<script>
  if(!window.supabase){
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');
  }
</script>
<style>
  /* ===== 配色（大白话：四种状态各有颜色）===== */
  :root{
    --green:#07c160;   /* 上班：绿 */
    --orange:#fa9d3b;  /* 休息：橙 */
    --gray:#c8c9cc;    /* 没打卡：灰 */
    --line:#ebedf0;
    --text:#333;
    --sub:#888;
    --bg:#f7f8fa;
    --blue:#576b95;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:0 0 60px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:12px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h1{font-size:18px;margin:4px 0 10px;text-align:center}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  /* 月份牌头：标题 + 4 状态图例 同一行 */
  .card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .card-hd h2{margin:0;font-size:15px}
  .legend{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:#666}
  .legend>span{display:inline-flex;align-items:center;gap:4px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;flex-shrink:0}
  .legend .lg-work{background:#07c160}
  .legend .lg-rest{background:#fa9d3b}
  .legend .lg-none{background:#bbb}
  .legend .lg-sup{background:#9c5cf5}
  h2 .tip{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input[type=date],input[type=text]{
    font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--text);min-width:0;flex:1
  }
  button{
    font-size:15px;padding:11px 14px;border:0;border-radius:8px;background:#f2f3f5;
    color:var(--text);cursor:pointer;flex:1;min-width:88px
  }
  button.work{background:var(--green);color:#fff}
  button.rest{background:var(--orange);color:#fff}
  button.primary{background:var(--blue);color:#fff}
  button.ghost{background:#f2f3f5;color:#555;flex:0 0 auto;min-width:0;padding:8px 12px;font-size:13px}
  button:active{opacity:.85}
  .ver{font-size:12px;color:var(--sub);margin-top:2px}
  .me{font-size:13px;color:var(--sub);text-align:center;margin-top:8px}
  .me a{color:var(--blue);text-decoration:none}
  .today{font-size:13px;color:var(--sub);text-align:center;margin-bottom:10px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;vertical-align:middle}
  .b-work{background:var(--green)}
  .b-rest{background:var(--orange)}
  .b-none{background:var(--gray);color:#fff}
  .b-sup{background:#9c5cf5}  /* 补打卡标记：紫 */
  /* 月份牌：minmax(0,1fr) 严格按父容器宽度算，列再挤也撑不爆，手机不溢出 */
  .cal-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
  .cal-head .mon{font-size:15px;font-weight:600;min-width:100px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%;overflow:hidden}
  .cal .wd{text-align:center;font-size:11px;color:var(--sub);padding:2px 0;min-width:0}
  /* 纯色块加深，格子内只显日号，补标移到底部不挡数字 */
  .day{aspect-ratio:1/1;border-radius:8px;background:#fafafa;border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;
       font-size:15px;font-weight:700;position:relative;color:#bbb;min-width:0;overflow:hidden}
  .day.empty{background:transparent;border:none}
  .day.none{background:#f5f5f5;color:#bbb}
  .day.work{background:#07c160;color:#fff;border-color:#07c160}
  .day.rest{background:#fa9d3b;color:#fff;border-color:#fa9d3b}
  .day.today{outline:3px solid #576b95;outline-offset:-3px;color:#576b95}
  .day.today.work{color:#fff}
  .day.today.rest{color:#fff}
  .day.today.none{background:#fff3e0;color:#fa9d3b;border-color:#fa9d3b}    /* 今天未打卡：橙黄警告 */
  .day .sup{position:absolute;bottom:3px;right:3px;font-size:9px;color:#fff;
            background:#9c5cf5;padding:1px 4px;border-radius:4px;line-height:1.2;font-weight:600}
  /* 档案弹窗日历：日期可点选看明细 */
  #pfCal .pfd{cursor:pointer}
  #pfCal .pfd.sel{outline:3px solid #576b95;outline-offset:-3px}
  #profileMask .modal{max-height:88vh;overflow-y:auto;overscroll-behavior:contain}

  /* 「今天我」状态卡：上下结构 —— "今天我" 在上、彩色大色块在下，更显眼 */
  .my-today{display:flex;justify-content:center;margin:14px 0 6px}
  .my-state{display:inline-flex;flex-direction:column;align-items:center;gap:8px;
            padding:14px 22px;background:#f5f6f8;border-radius:18px;
            box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .my-state-label{color:#888;font-weight:500;font-size:13px;letter-spacing:1px}
  .my-state-badge{padding:8px 26px;border-radius:10px;font-size:18px;
                  font-weight:700;color:#fff;letter-spacing:.5px;min-width:90px;text-align:center}
  .my-state-badge.b-work{background:var(--green)}
  .my-state-badge.b-rest{background:var(--orange)}
  .my-state-badge.b-none{background:var(--gray)}
  /* 表格（同事列表 / 统计）*/
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--sub);font-weight:500;font-size:12px}
  td.name{text-align:left;white-space:nowrap}
  td.name .name-link{color:var(--blue);text-decoration:none}
  td.name .name-link:active{opacity:.7}
  tr.me-row{background:#f0f6ff}
  /* 提示条 */
  .msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
       background:rgba(0,0,0,.78);color:#fff;padding:10px 16px;border-radius:8px;
       font-size:14px;max-width:80%;text-align:center;opacity:0;pointer-events:none;
       transition:opacity .2s;z-index:99}
  .msg.show{opacity:1}
  .err{background:#fff4f4;border:1px solid #ffd0d0;color:#c0392b;border-radius:10px;padding:12px;font-size:13px;margin-bottom:12px}
  .err pre{background:#2b2b2b;color:#eee;padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
  .err code{background:#eee;padding:1px 4px;border-radius:4px}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px}
  .modal h3{margin:0 0 12px;font-size:16px}
  .modal .field{margin-bottom:12px}
  .modal label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .modal .seg{display:flex;gap:8px}
  .modal .seg button{opacity:.4}                                    /* 未选中：淡 */
  .modal .seg button.sel{opacity:1;outline:2px solid var(--text);outline-offset:2px}  /* 选中：描边 */
  .modal .actions{display:flex;gap:8px;margin-top:6px}
  .hidden{display:none!important}
  /* 顶部 hero 卡片：左侧文字（标题/日期/名字）+ 右侧「今天我」状态卡 */
  .card.hero{display:flex;align-items:center;gap:14px}
  .card.hero .hero-left{flex:1;min-width:0}
  .card.hero .my-today{margin:0;flex-shrink:0}    /* 在 hero 内不居中、不带上下 margin */
  .app-footer{padding:16px 0 24px;text-align:center;font-size:12px;color:var(--sub);margin-top:10px}

  /* 通用确认弹窗必须盖在所有弹窗之上：
     .mask 都是 z-index:50，同层级时 DOM 靠后的会遮住靠前的，
     而 #confirmMask 排在成就墙/榜单之前，会被它们盖住 —— 表现就是「点了没反应」。
     给到 60，仅次于顶部 toast 的 99 */
  #confirmMask{z-index:60}

  /* ===== 成就系统 ===== */
  .modal.wide{max-width:520px;max-height:86vh;display:flex;flex-direction:column}
  .modal.wide .modal-bd{overflow:auto;margin:0 -4px;padding:0 4px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;font-size:13px;padding:8px 2px;min-width:0}
  .tabs button.sel{background:var(--blue);color:#fff}
  .style-sw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:10px}
  .style-sw .seg{display:flex;gap:6px}
  .style-sw .seg button{flex:0 0 auto;min-width:0;padding:5px 12px;font-size:12px;opacity:.45}
  .style-sw .seg button.sel{opacity:1;background:var(--blue);color:#fff}
  .note{background:#fff8e6;border:1px solid #ffe0a3;color:#a06a00;border-radius:8px;
        padding:8px 10px;font-size:12px;line-height:1.6;margin-bottom:10px}
  /* 成就墙网格 */
  .ach-group{margin-bottom:14px}
  .ach-group h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:600}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .ach-item{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 4px;
            text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
  .ach-item.unlocked{background:#fff;border-color:#ffd591;box-shadow:0 1px 3px rgba(250,173,20,.18)}
  .ach-item.locked{opacity:.5;filter:grayscale(.9)}
  .ach-item.hidden-ach{border-style:dashed}
  .ach-icon{font-size:24px;line-height:1.2}
  .ach-item.locked .ach-icon{opacity:.55}
  .ach-name{font-size:12px;font-weight:600;line-height:1.3}
  .ach-title{font-size:11px;color:var(--sub);line-height:1.3}
  .ach-new{font-size:10px;color:#d48806}
  /* 解锁庆祝弹窗 */
  .unlock-hero{text-align:center;padding:6px 0 10px}
  .unlock-hero .u-icon{font-size:52px;line-height:1.2}
  .unlock-hero .u-badge{display:inline-block;margin-top:6px;font-size:12px;color:#a06800;
                        background:#fff7e6;border:1px solid #ffd591;border-radius:10px;padding:2px 10px}
  .unlock-hero .u-name{font-size:17px;font-weight:700;margin-top:8px}
  .unlock-hero .u-title{font-size:14px;color:var(--blue);margin-top:2px}
  .unlock-hero .u-words{font-size:13px;color:#666;line-height:1.7;margin-top:10px}
  .unlock-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
  .unlock-dots i{width:6px;height:6px;border-radius:50%;background:#ddd;display:block}
  .unlock-dots i.on{background:var(--blue)}
  /* 榜单 */
  .lb-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .lb-row.me{background:#f0f6ff}
  .lb-rank{flex:0 0 26px;text-align:center;font-weight:700;color:var(--sub)}
  .lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-val{flex:0 0 auto;font-weight:600}
  .lb-title{font-size:11px;color:var(--sub);flex:0 0 auto}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat-box{background:#f7f8fa;border-radius:10px;padding:10px 6px;text-align:center}
  .stat-box .v{font-size:18px;font-weight:700;color:var(--blue)}
  .stat-box .k{font-size:11px;color:var(--sub);margin-top:2px}
  .empty-tip{color:var(--sub);font-size:13px;text-align:center;padding:18px 6px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card hero">
    <div class="hero-left">
      <h1>📅 团队打卡</h1>
      <div class="today" id="todayText"></div>
      <div class="me" id="meBar"></div>
    </div>
    <div class="my-today" id="myToday">正在加载今天状态…</div>
  </div>

  <div id="errBox" class="err hidden"></div>

  <!-- 主页：今天打卡 -->
  <div class="card" id="punchCard">
    <h2>今天打一下</h2>
    <div class="row" style="gap:10px">
      <button class="work" id="btnWork">✅ 上班</button>
      <button class="rest" id="btnRest">😴 休息</button>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <div class="row" style="flex:0 1 auto;gap:8px;flex-wrap:wrap">
        <button class="ghost" id="btnSupplement">📝 补打卡</button>
        <button class="ghost" id="btnRefresh">🔄 刷新</button>
      </div>
      <div class="row" style="flex:0 1 auto;gap:8px;flex-wrap:wrap">
        <button class="ghost" id="btnAch">🏅 我的成就</button>
        <button class="ghost" id="btnRank">📊 趣味榜</button>
      </div>
    </div>
  </div>

  <!-- 月份牌 -->
  <div class="card">
    <div class="card-hd">
      <h2>月份牌</h2>
      <div class="legend">
        <span><i class="lg-work"></i>上班</span>
        <span><i class="lg-rest"></i>休息</span>
        <span><i class="lg-none"></i>未打卡</span>
        <span><i class="lg-sup"></i>补</span>
      </div>
    </div>
    <div class="cal-head">
      <button class="ghost" id="calPrev">◀</button>
      <div class="mon" id="calMon"></div>
      <button class="ghost" id="calNext">▶</button>
    </div>
    <div class="cal" id="calGrid"></div>
  </div>

  <!-- 同事列表：今天谁上了谁休了 -->
  <div class="card">
    <h2>同事今天 <span class="tip" id="colleagueDate"></span></h2>
    <table id="colleagueTable">
      <thead><tr><th class="name">姓名</th><th>状态</th></tr></thead>
      <tbody id="colleagueBody"></tbody>
    </table>
  </div>

  <!-- 按月统计 -->
  <div class="card">
    <h2>当月统计 <span class="tip">出勤 / 休息 / 未打卡</span></h2>
    <table id="statTable">
      <thead><tr><th class="name">姓名</th><th>出勤</th><th>休息</th><th>未打卡</th></tr></thead>
      <tbody id="statBody"></tbody>
    </table>
  </div>
</div>

<!-- 认人弹窗（首次 / 切换）-->
<div class="mask" id="nameMask">
  <div class="modal">
    <h3 id="nameTitle">先选一下你是谁</h3>
    <div class="field">
      <label>输入或选择你的名字（本机记住，换手机重选）</label>
      <input type="text" id="nameInput" list="nameList" placeholder="例如：小王" />
      <datalist id="nameList"></datalist>
    </div>
    <div class="actions">
      <button class="primary" id="nameSave" style="flex:1">确定</button>
    </div>
  </div>
</div>

<!-- 切换身份弹窗（密码 + 选/输新名字） -->
<div class="mask" id="switchMask">
  <div class="modal">
    <h3>切换身份</h3>
    <div class="field">
      <label>切换密码</label>
      <input type="password" id="switchPwd" placeholder="请输入切换密码" autocomplete="off" />
    </div>
    <div class="field">
      <label>选择或输入名字（可从团队已有名字里挑）</label>
      <input type="text" id="switchNameInput" list="nameList" placeholder="例如：小王" />
    </div>
    <div class="actions">
      <button class="ghost" id="switchCancel" style="flex:1">取消</button>
      <button class="primary" id="switchOk" style="flex:1">切换</button>
    </div>
  </div>
</div>

<!-- 补打卡弹窗 -->
<div class="mask" id="supMask">
  <div class="modal">
    <h3>补打卡（只能补自己）</h3>
    <div class="field">
      <label>选日期</label>
      <input type="date" id="supDate" />
    </div>
    <div class="field">
      <label>状态</label>
      <div class="seg">
        <button class="work" id="supWork" style="flex:1">上班</button>
        <button class="rest" id="supRest" style="flex:1">休息</button>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" id="supCancel" style="flex:1">取消</button>
      <button class="primary" id="supSubmit" style="flex:1">提交补卡</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗（重复打卡提示 / 改打卡确认） -->
<div class="mask" id="confirmMask">
  <div class="modal">
    <h3 id="confirmTitle">确认</h3>
    <div class="field">
      <div id="confirmText" style="font-size:14px;color:#555;line-height:1.6"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="confirmCancel" style="flex:1">取消</button>
      <button class="primary" id="confirmOk" style="flex:1">确定</button>
    </div>
  </div>
</div>

<!-- 成就墙：我的全部成就 + 风格切换 -->
<div class="mask" id="achMask">
  <div class="modal wide">
    <h3>🏅 我的成就</h3>
    <div class="style-sw">
      <span>称号风格</span>
      <div class="seg">
        <button id="styleWenyi">文艺风</button>
        <button id="styleHumor">幽默风</button>
      </div>
      <span style="margin-left:auto" id="achSummary"></span>
    </div>
    <div class="modal-bd" id="achBody"></div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="achClose" style="flex:1">关闭</button>
    </div>
  </div>
</div>

<!-- 打卡反馈：解锁成就 / 随机语录 -->
<div class="mask" id="unlockMask">
  <div class="modal">
    <div class="unlock-hero" id="unlockHero"></div>
    <div class="unlock-dots" id="unlockDots"></div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="unlockNext" style="flex:1">好的</button>
    </div>
  </div>
</div>

<!-- 趣味排行榜 -->
<div class="mask" id="rankMask">
  <div class="modal wide">
    <h3>📊 趣味排行榜</h3>
    <div class="note">📌 趣味排行榜仅供娱乐参考，不关联绩效、奖金、评优。休假是正常权利，不必刻意冲高连续天数。</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div class="tabs" style="flex:1;margin:0">
        <button id="tabRef" class="sel">我的参考</button>
        <button id="tabCur">当前连续榜</button>
        <button id="tabBest">荣誉殿堂</button>
      </div>
      <button class="ghost" id="btnJoinLb" style="flex:0 0 auto">上榜设置</button>
    </div>
    <div class="modal-bd" id="rankBody"></div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="rankClose" style="flex:1">关闭</button>
    </div>
  </div>
</div>

<!-- 同事档案弹窗：日历明细视图（用户现实需要：查看某人哪天打卡/具体时刻） -->
<div class="mask" id="profileMask">
  <div class="modal">
    <h3 id="profileName">考勤档案</h3>
    <div class="stat-grid" style="margin-bottom:10px">
      <div class="stat-box"><div class="v" id="pfTotal">…</div><div class="k">累计出勤</div></div>
      <div class="stat-box"><div class="v" id="pfCur">…</div><div class="k">当前连续</div></div>
      <div class="stat-box"><div class="v" id="pfMax">…</div><div class="k">历史最高</div></div>
    </div>
    <div class="cal-head" style="margin-bottom:6px">
      <button class="ghost" id="pfPrev">◀</button>

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
// 判断错误是不是"表不存在"，好区分"要建表"和"网络/其它故障"
function isTableMissing(e){
  const c = (e && e.code) || '';
  const m = (e && e.message) || '';
  return c==='PGRST205' || c==='42P01' || /does not exist|schema cache/i.test(m);
}

// 本地日期转 YYYY-MM-DD（用本地时区，避免 UTC 差一天）
function ymd(y, m, d){
  const mm = String(m+1).padStart(2,'0');
  const dd = String(d).padStart(2,'0');
  return `${y}-${mm}-${dd}`;
}
function todayStr(){ const t=new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }
function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
function pad2(n){ return String(n).padStart(2,'0'); }

// 顶部小提示

function toast(t){
  const el=$('msg'); el.textContent=t; el.classList.add('show');
  clearTimeout(msgTimer); msgTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

// 状态 -> 文案/样式

  if(rec.status==='work') return rec.is_supplement ? {label:'上班(补)', cls:'work', sup:true} : {label:'上班', cls:'work'};
  return rec.is_supplement ? {label:'休息(补)', cls:'rest', sup:true} : {label:'休息', cls:'rest'};
}

/* 换名字公用动作：改本机身份 +（可选）迁移数据库记录 + 重新拉数据
   ⚠️ migrate 的语义差别很关键：
     - 改名（同一个人换名字，比如输错了）：migrate=true，历史记录要跟着人走
     - 切换（换另一个人来打卡）：migrate=false，绝不能动数据库！
       否则会把「我自己」的历史打卡全改成对方的名字，两边的考勤数据就全串了 */
async function changeNameTo(newName, migrate){
  const oldName = MY_NAME;
  if(!newName || newName === oldName) return false;
  saveName(newName);                                  // 改 localStorage + 内存 MY_NAME
  if(migrate && oldName){
    // ⚠️ 目标名字已在库里 -> 视为「切换」而不是「改名」，不要迁移！
    // 否则 update name=新 where name=旧 会和对方“同一天”的记录撞 unique(name,date)，
    // 报 23505 后身份已切、旧记录又没迁走，界面就错乱（看到的是对方的、自己的“丢了”）
    if(roster.includes(newName)){
      toast('「'+newName+'」已有人使用，已切换过去（不合并历史）');
    }else{
      const { error:updErr } = await sb.from(TABLE).update({ name: newName }).eq('name', oldName);
      if(updErr){ toast('数据库历史迁移失败：'+(updErr.message||'')); return false; }
    }
  }
  const now=new Date(); VIEW_Y=now.getFullYear(); VIEW_M=now.getMonth();
  achStats = null; newUnlockedIds = new Set();   // 换人了，成就要按新身份重算
  try{ await loadAll(); await renderAll(); await syncAchievementsSilent(); }
  catch(e){ showRuntimeError(e); }
  return true;
}

// 名字下拉：用表里已有的名字当候选（方便老同事快速选）
async function refreshNameList(){
  try{
    // 上限 2000 行：小团队够用很久，避免表变大后每次都全表扫
    const { data, error } = await sb.from(TABLE).select('name').limit(2000);
    if(error) throw error;
    const set = new Set((data||[]).map(r=>r.name).filter(Boolean));
    roster = Array.from(set);
  }catch(e){ roster = []; }
  const dl = $('nameList');
  dl.innerHTML = roster.map(n=>`<option value="${esc(n)}"></option>`).join('');
}

  const { data:mine, error:e1 } = await sb.from(TABLE).select('*').eq('name', MY_NAME).gte('date', first).lte('date', last);

  myMonthRecs = {};
  (mine||[]).forEach(r=>{ myMonthRecs[r.date]=r; });
  // 全员（统计 & 同事列表用）
  const { data:all, error:e2 } = await sb.from(TABLE).select('*').gte('date', first).lte('date', last);
  if(e2) throw e2;
  monthAllRecs = all||[];
}

  const total = daysInMonth(VIEW_Y, VIEW_M);
  const tStr = todayStr();
  const nowT = new Date(); nowT.setHours(0,0,0,0);
  for(let i=0;i<firstDay;i++) html += `<div class="day empty"></div>`;
  for(let d=1; d<=total; d++){

    const rec = myMonthRecs[ds] || null;
    const isToday = ds===tStr;
    const cls = ['day'];
    if(isToday) cls.push('today');
    if(rec){
      cls.push(rec.status);                              // 'work' 或 'rest'，颜色由 .day.work / .day.rest 决定
    } else {
      const dt = new Date(VIEW_Y, VIEW_M, d);
      if(dt <= nowT) cls.push('none');                   // 过去/今天没打卡：灰（今天还会被 .day.today.none 覆盖成警告色）
      // 未来没打卡就完全留空，不加任何类
    }
    const supTag = (rec && rec.is_supplement) ? '<span class="sup">补</span>' : '';
    html += `<div class="${cls.join(' ')}">${supTag}<span class="d">${d}</span></div>`;
  }
  grid.innerHTML = html;
}

  if(y>now.getFullYear() || (y===now.getFullYear() && m>now.getMonth())) elapsed = 0;

  monthAllRecs.forEach(r=>{

    byName[r.name].punched++;

  const names = Array.from(new Set([...Object.keys(byName), ...roster]));
  const body = $('statBody');
  if(names.length===0){ body.innerHTML = `<tr><td colspan="4" class="name" style="color:var(--sub)">本月暂无数据</td></tr>`; }
  else{

    }).join('');
  }
}

/* =========================================================================
   成就系统：统计计算 + 成就墙 + 打卡反馈 + 趣味榜
   ========================================================================= */
let myAllRecs = [];        // 我的全量打卡记录（成就统计用）
let achStats  = null;      // 我的成就统计结果
let myPrefs   = {style:'wenyi', join:false, tableOk:false};   // 偏好（风格 / 是否上榜）
let rankAllRecs = [];      // 全员全量记录（榜单用）
let rankJoinNames = null;  // 愿意上榜的人名单；null = 偏好表还没建
let newUnlockedIds = new Set();   // 本次新解锁（成就墙打 NEW 标记用）

/* ---------- 基础判定 ---------- */
// 打卡时刻（本地 HH:MM）。created_at 是 timestamptz，new Date() 会转成本地时区
function punchHM(rec){
  if(!rec || !rec.created_at) return null;
  const d = new Date(rec.created_at);
  if(isNaN(d.getTime())) return null;
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}
// 工作日：周一~周五，且不是法定节假日；调休上班日单独加回来
function isWorkday(ds){
  if(HOLIDAYS.indexOf(ds) >= 0) return false;
  if(EXTRA_WORKDAYS.indexOf(ds) >= 0) return true;
  const wd = new Date(ds+'T00:00:00').getDay();
  return wd >= 1 && wd <= 5;
}
function monthKey(){ const t = new Date(); return t.getFullYear()+'-'+pad2(t.getMonth()+1); }
function styleOf(){ return localStorage.getItem('kq_style') || 'wenyi'; }
function setStyle(v){ localStorage.setItem('kq_style', v); }
function titleOf(a){ return styleOf()==='humor' ? a.humor : a.wenyi; }
// 已弹过窗的成就记在 localStorage；月度成就按「id@YYYY-MM」记，所以每月能再弹一次
function notifiedKey(a){ return a.repeat ? (a.id+'@'+monthKey()) : a.id; }
function loadNotified(){
  try{ return JSON.parse(localStorage.getItem('kq_ach_notified') || '{}'); }catch(e){ return {}; }
}
function saveNotified(o){ localStorage.setItem('kq_ach_notified', JSON.stringify(o)); }

/* ---------- 统计核心 ----------
   口径：工作日当日有任意一次打卡 = 有效出勤（上班/休息都算）
        补卡只算有效出勤，不参与早到/收官/深夜/卡点判定
        周末与法定节假日不参与计算，也不打断连续 */
function calcAchStats(recs){
  const st = {
    totalDays:0, maxStreak:0, curStreak:0,
    everEarly:false, everLate:false, everRush:false, everNight:false,
    firstMonthFull:false,
    monthWorkdays:0, monthFull:false, monthEarly:0, monthLate:0,
    monthMondayAll:false, monthFridayAll:false
  };
  const byDate = {};
  (recs||[]).forEach(r=>{ byDate[r.date] = r; });
  const dates = Object.keys(byDate).sort();
  if(dates.length === 0) return st;

  // 1) 生涯累计 + 时刻类彩蛋
  dates.forEach(ds=>{
    if(!isWorkday(ds)) return;
    st.totalDays++;
    const r = byDate[ds];
    if(r.is_supplement) return;                    // 补卡不参与时刻判定
    const hm = punchHM(r);
    if(!hm) return;
    if(hm <= '07:59') st.everEarly = true;
    if(hm >= WORK_END) st.everLate  = true;
    if(hm >= '08:25' && hm <= '08:30') st.everRush  = true;
    if(hm >= '23:50' && hm <= '23:59') st.everNight = true;
  });

  // 2) 连续出勤：从入职日遍历到今天；今天还没打卡不算断（当天没过完）
  const today = todayStr();
  const d = new Date(dates[0]+'T00:00:00');
  const end = new Date(today+'T00:00:00');
  let streak = 0, max = 0;
  while(d <= end){
    const ds = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    if(isWorkday(ds)){
      if(byDate[ds]){ streak++; if(streak > max) max = streak; }
      else if(ds !== today){ streak = 0; }
    }
    d.setDate(d.getDate()+1);
  }
  st.maxStreak = max;
  st.curStreak = streak;

  // 3) 首月满勤：仅对"已结束"的自然月判定。当前月一律不判
  //    避免入职当天/月中几天就误判「满勤」（同样的坑月度满勤 v1.1.1 修过）
  const fd = new Date(dates[0]+'T00:00:00');
  const fy = fd.getFullYear(), fm = fd.getMonth();
  const now = new Date();
  const isCur = (fy === now.getFullYear() && fm === now.getMonth());
  if(isCur){
    st.firstMonthFull = false;
  }else{
    let fFull = true, fCnt = 0;
    const fEnd = daysInMonth(fy, fm);
    for(let dd = fd.getDate(); dd <= fEnd; dd++){
      const ds = ymd(fy, fm, dd);
      if(!isWorkday(ds)) continue;
      fCnt++;
      if(!byDate[ds]){ fFull = false; break; }
    }
    st.firstMonthFull = fFull && fCnt > 0;
  }

  // 4) 当月统计：只算到今天，未来工作日不算缺勤（否则满勤永远拿不到）
  const y = now.getFullYear(), m = now.getMonth();
  let wdTotal=0, wdHit=0, monT=0, monH=0, friT=0, friH=0;
  for(let dd=1; dd <= now.getDate(); dd++){
    const ds = ymd(y, m, dd);
    if(!isWorkday(ds)) continue;
    wdTotal++;
    const r = byDate[ds];
    if(r) wdHit++;
    const wd = new Date(ds+'T00:00:00').getDay();
    if(wd === 1){ monT++; if(r) monH++; }
    if(wd === 5){ friT++; if(r) friH++; }
    if(r && !r.is_supplement){
      const hm = punchHM(r);
      if(hm){
        if(hm <= '07:59') st.monthEarly++;
        if(hm >= WORK_END) st.monthLate++;
      }
    }
  }
  st.monthWorkdays  = wdHit;
  st.monthMondayAll = monT > 0 && monH === monT;
  st.monthFridayAll = friT > 0 && friH === friT;
  // 月度满勤：必须等月过完才算。当月一律不判（避免月初打 2 天就"满勤"）；
  // 历史上有过任意一个月满勤 → monthFull=true（生涯式触发，不每月重复弹窗）
  const nowKey = y*100 + m;
  const checkedMonths = new Set();
  let monthFull = false;
  Object.keys(byDate).forEach(ds=>{
    const yy = +ds.slice(0,4), mm = +ds.slice(5,7)-1;
    const key = yy*100 + mm;
    if(key >= nowKey || checkedMonths.has(key)) return;
    checkedMonths.add(key);
    const total = daysInMonth(yy, mm);
    let allWd=0, allHit=0;
    for(let dd=1; dd<=total; dd++){
      const tds = ymd(yy, mm, dd);
      if(!isWorkday(tds)) continue;
      allWd++;
      if(byDate[tds]) allHit++;
    }
    if(allWd > 0 && allHit === allWd) monthFull = true;
  });
  st.monthFull = monthFull;
  return st;
}

function evalAchievements(st){
  return ACHIEVEMENTS.filter(a=>{ try{ return !!a.test(st); }catch(e){ return false; } });
}
// 连续天数 -> 对应成就称号（榜单和个人面板复用）
function streakTitle(days){
  const order = [['streak66',66],['streak30',30],['streak15',15],['streak7',7]];
  for(let i=0;i<order.length;i++){
    if(days >= order[i][1]){
      const a = ACHIEVEMENTS.find(x=>x.id === order[i][0]);
      return a ? titleOf(a) : '';
    }
  }
  return '';
}

/* ---------- 成就墙 ---------- */
function renderAchWall(){
  const unlocked = new Set(achStats ? evalAchievements(achStats).map(a=>a.id) : []);
  const html = ACH_GROUPS.map(g=>{
    // 隐藏成就：没解锁就不露脸
    const list = ACHIEVEMENTS.filter(a=>a.group===g.k && !(a.hidden && !unlocked.has(a.id)));
    if(list.length === 0) return '';
    const items = list.map(a=>{
      const on = unlocked.has(a.id);
      const isNew = on && newUnlockedIds.has(a.id);
      return `<div class="ach-item ${on?'unlocked':'locked'} ${a.hidden?'hidden-ach':''}">
        <div class="ach-icon">${on ? a.icon : '🔒'}</div>
        <div class="ach-name">${esc(a.name)}</div>
        <div class="ach-title">${on ? esc(titleOf(a)) : '未解锁'}</div>
        ${isNew ? '<div class="ach-new">NEW</div>' : ''}
      </div>`;
    }).join('');
    return `<div class="ach-group"><h4>${g.n}</h4><div class="ach-grid">${items}</div></div>`;
  }).join('');
  $('achBody').innerHTML = html || `<div class="empty-tip">暂无成就数据</div>`;
  $('achSummary').textContent = `已解锁 ${unlocked.size}/${ACHIEVEMENTS.length}`;
  $('styleWenyi').classList.toggle('sel', styleOf() !== 'humor');
  $('styleHumor').classList.toggle('sel', styleOf() === 'humor');
}

/* ---------- 打卡反馈：新成就 / 随机语录 ---------- */
let unlockQueue = [], unlockIdx = 0;
function showUnlock(list){
  unlockQueue = list.slice(); unlockIdx = 0;
  renderUnlock();
  $('unlockMask').classList.add('show');
}
function renderUnlock(){
  const a = unlockQueue[unlockIdx];
  if(!a) return;
  $('unlockHero').innerHTML = `
    <div class="u-icon">${a.icon}</div>
    <div class="u-badge">${esc(a.badge)}</div>
    <div class="u-name">${esc(a.name)}</div>
    <div class="u-title">称号 · ${esc(titleOf(a))}</div>
    <div class="u-words">${esc(a.words)}</div>`;
  $('unlockDots').innerHTML = unlockQueue.map((_,i)=>`<i class="${i===unlockIdx?'on':''}"></i>`).join('');
  $('unlockNext').textContent = unlockIdx < unlockQueue.length-1
    ? `下一个（还有 ${unlockQueue.length-1-unlockIdx} 项）` : '太棒了';
}
// 有新成就就庆祝，没有就挑一句语录（按本次打卡时刻选类别，补卡只用通用语录）
function showPunchFeedback(fresh, hm, isSupp){
  if(fresh && fresh.length){ showUnlock(fresh); return; }
  let pool = QUOTES.common;
  if(!isSupp && hm){
    if(hm >= '23:00') pool = QUOTES.night;
    else if(hm <= '07:59') pool = QUOTES.early;
    else if(hm >= WORK_END) pool = QUOTES.late;
  }
  const q = pool[Math.floor(Math.random()*pool.length)];
  unlockQueue = [];
  $('unlockHero').innerHTML = `
    <div class="u-icon">${isSupp ? '📝' : '✅'}</div>
    <div class="u-name">${isSupp ? '补卡完成' : '打卡成功'}</div>
    <div class="u-words">${esc(q)}</div>`;
  $('unlockDots').innerHTML = '';
  $('unlockNext').textContent = '好的';
  $('unlockMask').classList.add('show');
}

/* ---------- 成就检查 ---------- */
async function checkAchievements(){
  myAllRecs = await loadMyAllRecs();
  achStats  = calcAchStats(myAllRecs);
  const should = evalAchievements(achStats);
  const notified = loadNotified();
  const fresh = should.filter(a=>!notified[notifiedKey(a)]);   // 只有没弹过的才算「新解锁」
  should.forEach(a=>{ notified[notifiedKey(a)] = Date.now(); });
  saveNotified(notified);
  newUnlockedIds = new Set(fresh.map(a=>a.id));
  return fresh;
}
// 进页面时静默同步：历史成就直接记为已读，避免一打开就弹一堆旧成就
async function syncAchievementsSilent(){
  try{
    myAllRecs = await loadMyAllRecs();
    achStats  = calcAchStats(myAllRecs);
    const notified = loadNotified();
    evalAchievements(achStats).forEach(a=>{
      if(!notified[notifiedKey(a)]) notified[notifiedKey(a)] = Date.now();
    });
    saveNotified(notified);
  }catch(e){}
}

/* ---------- 趣味榜 ----------
   反内卷约束：默认不上榜、只展示 TOP50、无垫底展示、无部门对比、不做任何推送 */
const PREFS_SQL = `-- 排行榜偏好表：只存「称号风格」和「是否愿意上榜」，不建也能正常打卡
create table if not exists public.kaoqin_prefs (
  name text primary key,
  style text not null default 'wenyi',                  -- wenyi 文艺风 / humor 幽默风
  join_leaderboard boolean not null default false,      -- 默认不上榜
  updated_at timestamptz not null default now()
);

alter table public.kaoqin_prefs enable row level security;

drop policy if exists "anon_select" on public.kaoqin_prefs;
create policy "anon_select" on public.kaoqin_prefs for select to anon using (true);
drop policy if exists "anon_insert" on public.kaoqin_prefs;
create policy "anon_insert" on public.kaoqin_prefs for insert to anon with check (true);
drop policy if exists "anon_update" on public.kaoqin_prefs;
create policy "anon_update" on public.kaoqin_prefs for update to anon using (true) with check (true);
-- 和主表一致：不开放匿名删除`;

let rankTab = 'ref';   // ref 我的参考 / cur 当前连续榜 / best 荣誉殿堂
function calcAllStreaks(allRecs){
  const byName = {};
  (allRecs||[]).forEach(r=>{ (byName[r.name] = byName[r.name] || {})[r.date] = r; });
  return Object.keys(byName).map(n=>{
    const st = calcAchStats(Object.keys(byName[n]).map(d=>byName[n][d]));
    return {name:n, cur:st.curStreak, max:st.maxStreak, total:st.totalDays};
  });
}
function renderRank(){
  const body = $('rankBody');
  $('tabRef').classList.toggle('sel', rankTab==='ref');
  $('tabCur').classList.toggle('sel', rankTab==='cur');
  $('tabBest').classList.toggle('sel', rankTab==='best');
  const all = calcAllStreaks(rankAllRecs);

  // Tab1：我的参考面板（只有自己的数据 + 团队数字参考，零排名压力）
  if(rankTab === 'ref'){
    const me = all.find(x=>x.name===MY_NAME);
    const cur = me?me.cur:0, best = me?me.max:0;
    const maxAll = all.reduce((m,x)=>Math.max(m,x.max), 0);
    const avgAll = all.length ? Math.round(all.reduce((s,x)=>s+x.max,0)/all.length) : 0;
    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="v">${cur}</div><div class="k">我的当前连续</div></div>
        <div class="stat-box"><div class="v">${best}</div><div class="k">我的历史最高</div></div>
        <div class="stat-box"><div class="v" style="font-size:14px">${esc(streakTitle(best)||'—')}</div><div class="k">最高称号</div></div>
      </div>
      <div class="note" style="background:#f0f6ff;border-color:#cfe3ff;color:#3a6ea5">
        团队参考：最高 ${maxAll} 天 · 平均 ${avgAll} 天（只有数字，不含任何人员信息）
      </div>
      <div class="empty-tip" style="padding:4px">这里只有你自己的数据，没有排名、没有对比压力 😊</div>
      ${rankJoinNames === null
        ? `<div class="note" style="margin-top:10px">想看团队榜单？需要先建一张偏好表，点右上角「上榜设置」里面有 SQL。</div>`
        : ''}`;
    return;
  }

  // 偏好表还没建：给出 SQL，成就系统不受影响
  if(rankJoinNames === null){
    body.innerHTML = `<div class="empty-tip">排行榜需要一张偏好表来记录「谁愿意上榜」。<br/>
      <span style="font-size:12px">在 Supabase 后台 SQL Editor 执行一次即可</span><br/>
      <button class="ghost" id="copyPrefSql" style="margin-top:10px;flex:0 0 auto">复制建表 SQL</button></div>`;
    const b = $('copyPrefSql');
    if(b) b.onclick = ()=>{
      navigator.clipboard.writeText(PREFS_SQL)
        .then(()=>toast('SQL 已复制'), ()=>toast('复制失败，手动选一下'));
    };
    return;
  }
  if(!myPrefs.join){
    body.innerHTML = `<div class="empty-tip">你已关闭上榜权限，不参与公开展示<br/>
      <span style="font-size:12px">想上榜单，点右上角「上榜设置」开启，随时可关</span></div>`;
    return;
  }
  const joinSet = new Set(rankJoinNames || []);
  const list = all.filter(x=>joinSet.has(x.name));
  const key = rankTab === 'cur' ? 'cur' : 'max';
  const sorted = list.slice().sort((a,b)=>b[key]-a[key]).slice(0, 50);   // 只展示 TOP50
  if(sorted.length === 0){
    body.innerHTML = `<div class="empty-tip">还没有人上榜</div>`;
    return;
  }
  body.innerHTML = sorted.map((x,i)=>`
    <div class="lb-row ${x.name===MY_NAME?'me':''}">
      <div class="lb-rank">${i<3 ? ['🥇','🥈','🥉'][i] : (i+1)}</div>
      <div class="lb-name">${esc(x.name)}${x.name===MY_NAME?' ·我':''}</div>
      <div class="lb-title">${esc(streakTitle(x[key])||'')}</div>
      <div class="lb-val">${x[key]} 天</div>

async function loadUserFullRecs(name){
  const { data, error } = await sb.from(TABLE)
    .select('date,status,is_supplement,created_at')
    .eq('name', name).limit(5000);
  if(error) throw error;
  return data || [];

let prof = null;   // { name, byDate:{'YYYY-MM-DD':rec}, st, y, m }
function renderProfileCal(){
  if(!prof) return;
  const grid = $('pfCal');
  const wds = ['日','一','二','三','四','五','六'];
  let html = wds.map(w=>`<div class="wd">${w}</div>`).join('');
  const first = new Date(prof.y, prof.m, 1).getDay();
  const total = daysInMonth(prof.y, prof.m);
  const nowT = new Date(); nowT.setHours(0,0,0,0);
  for(let i=0;i<first;i++) html += '<div class="day empty"></div>';
  for(let d=1; d<=total; d++){
    const ds = ymd(prof.y, prof.m, d);
    const rec = prof.byDate[ds] || null;
    const cls = ['day','pfd'];
    if(rec) cls.push(rec.status);                       // work / rest 上色
    else{ const dt = new Date(prof.y, prof.m, d); if(dt<=nowT) cls.push('none'); }
    const supTag = (rec && rec.is_supplement) ? '<span class="sup">补</span>' : '';
    html += `<div class="${cls.join(' ')}" data-ds="${ds}">${supTag}<span class="d">${d}</span></div>`;
  }
  grid.innerHTML = html;
}
function selectProfDay(ds){
  if(!prof || !ds) return;
  const rec = prof.byDate[ds];
  const [y,m,d] = ds.split('-').map(Number);
  const wd = ['日','一','二','三','四','五','六'][new Date(y, m-1, d).getDay()];
  const hm = punchHM(rec);
  let box;
  if(rec && rec.status==='work'){
    box = `✅ <b>${m}月${d}日 · 周${wd} · 上班</b><br><span style="color:var(--sub);font-size:12px">打卡时刻 ${hm||'—'}${rec.is_supplement?' · ↩ 补卡':''}</span>`;
  }else if(rec && rec.status==='rest'){
    box = `😴 <b>${m}月${d}日 · 周${wd} · 休息</b><br><span style="color:var(--sub);font-size:12px">${rec.is_supplement?'↩ 补卡':'本人报备休息'}</span>`;
  }else{
    const dt = new Date(y, m-1, d), nowT = new Date(); nowT.setHours(0,0,0,0);
    box = dt > nowT
      ? `<span style="color:#bbb">${m}月${d}日 · 周${wd} · 尚未到</span>`
      : `${m}月${d}日 · 周${wd} · <b style="color:#fa9d3b">未打卡</b>`;
  }
  $('pfDay').innerHTML = box;
  document.querySelectorAll('#pfCal .pfd').forEach(el=> el.classList.toggle('sel', el.dataset.ds===ds));
}

/* =========================================================================
   打卡 / 补打卡（核心：同一天覆盖）
   ========================================================================= */
async function punch(status, isSupplement){
  const date = isSupplement ? $('supDate').value : todayStr();
  if(!date){ toast('请先选日期'); return; }
  if(!MY_NAME){ toast('先选名字'); return; }
  if(date > todayStr()){ toast('不能打未来的日期'); return; }  // YYYY-MM-DD 可直接比大小
  // 补打卡强制只补自己（软限制）
  const payload = { name: MY_NAME, date, status, is_supplement: !!isSupplement };
  // upsert：以 (name,date) 为唯一键覆盖当天，点错再点就改
  const { error } = await sb.from(TABLE).upsert(payload, { onConflict: 'name,date' });
  if(error){
    // 表没了要引导重建；其它错误（网络抖动等）轻量提示，不打断页面
    if(isTableMissing(error)) showRuntimeError(error);
    else toast('保存失败：'+(error.message||''));
    return;
  }
  await loadAll();
  await renderAll();
  // 打卡反馈：有新解锁的成就就庆祝，没有就给一句随机语录
  try{
    const fresh = await checkAchievements();
    const tRec = (myAllRecs||[]).find(r=>r.date===date) || null;
    showPunchFeedback(fresh, punchHM(tRec), isSupplement);
  }catch(e){
    toast(isSupplement ? '补卡成功' : '已记录');   // 成就算不出来，至少给个基础反馈
  }
}

/* =========================================================================
   通用确认弹窗：askConfirm() 返回 Promise<boolean>
   ========================================================================= */
let confirmResolve = null;
function askConfirm(opt){
  // 把确认弹窗挪到 body 最后：即使 z-index 相同，DOM 靠后的也会盖在前面那些之上。
  // 它原本排在成就墙/榜单之前，不挪会被压在下面，表现就是「点了没反应」。
  const cm = $('confirmMask');
  if(cm && cm.parentNode) cm.parentNode.appendChild(cm);
  $('confirmTitle').textContent = opt.title || '确认';
  $('confirmText').innerHTML = opt.text || '';
  $('confirmOk').textContent = opt.okText || '确定';
  // showCancel:false 时只留一个按钮（纯提示场景）
  $('confirmCancel').style.display = opt.showCancel === false ? 'none' : '';
  $('confirmMask').classList.add('show');
  return new Promise(res=>{ confirmResolve = res; });
}
function closeConfirm(v){
  $('confirmMask').classList.remove('show');
  const r = confirmResolve; confirmResolve = null;
  if(r) r(v);
}

/* =========================================================================
   主页打卡：当天已打卡时，点相同的只提示，点不同的先确认再覆盖
   ========================================================================= */
async function punchToday(status){
  if(!MY_NAME){ toast('先选名字'); return; }
  const cur = myTodayRec;                              // 我今天的记录（没有就是 null）
  const newLabel = status==='work' ? '上班' : '休息';
  if(cur && cur.status === status){
    // 已经打过一模一样的：提示一下就行，不覆盖（避免误触刷 created_at）
    await askConfirm({
      title:'今天已经打过卡了',
      text:`今天（${todayStr()}）已经记录为 <b>${esc(statusText(cur).label)}</b>${cur.is_supplement?'（补打卡）':''}，不用重复打卡。`,
      okText:'知道了', showCancel:false
    });
    return;
  }
  if(cur){
    // 打过但状态不同：改状态要先确认，避免手滑覆盖
    const ok = await askConfirm({
      title:'确认修改今天的打卡？',
      text:`今天（${todayStr()}）当前是 <b>${esc(statusText(cur).label)}</b>，要改成 <b>${newLabel}</b> 吗？<br/>
            <span style="color:#999;font-size:12px">确认后覆盖为「${newLabel}」。</span>`,
      okText:'确认修改', showCancel:true
    });
    if(!ok) return;
  }
  await punch(status, false);                          // 没打过，或已确认，才真正写入
}

// 区分"要建表"和"网络/其它故障"——原来一律提示建表，网络抖动也会误导人去跑 SQL
function showRuntimeError(e){
  const detail = [ (e && e.message) || '', (e && e.code) ? ('[code:'+e.code+']') : '' ].filter(Boolean).join(' ');
  if(isTableMissing(e)){
    showError({
      title:'⚠️ 还没建表，工具现在用不了。',
      desc:'这是一次性动作：打开 Supabase 后台 → SQL Editor，把下面的 SQL 粘进去点 Run，然后刷新本页即可。',
      sql:true, detail
    });
  }else{
    showError({
      title:'⚠️ 连不上数据库，或数据读取出错。',
      desc:'不是建表问题，多半是网络不通、Supabase 项目暂停，或 RLS 策略没配好。检查网络后刷新本页重试。',
      sql:false, detail
    });
  }
}

async function boot(){
  // 先创建客户端
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }catch(e){
    showError({ title:'⚠️ 组件没加载成功',
      desc:'supabase-js 没加载（CDN 被墙或断网）。检查网络后刷新本页重试。',
      detail:(e && e.message) || String(e) });
    return;
  }
  // 探一下表在不在：查一条，错就给对应指引
  let probe;
  try{
    probe = await sb.from(TABLE).select('id').limit(1);
  }catch(e){
    // 网络不通/项目暂停时 await 会直接抛异常。原来这里裸奔，页面会永久卡在"正在加载…"
    showRuntimeError(e);
    return;
  }
  if(probe.error){ showRuntimeError(probe.error); return; }
  // 表 OK，进入认人流程
  MY_NAME = loadName();
  const now = new Date();
  VIEW_Y = now.getFullYear(); VIEW_M = now.getMonth();
  if(!MY_NAME){
    try{ await refreshNameList(); }catch(e){}   // 先拉一次名单，首次选名字时下拉才有建议可选
    showNameModal();
  }else{
    try{
      await loadAll(); await renderAll();
      syncAchievementsSilent();   // 后台静默同步成就，不阻塞首屏
    }
    catch(e){ showRuntimeError(e); }
  }
}

    // 打过但状态不同：先确认再覆盖
    const ok = await askConfirm({
      title:'确认修改这天的打卡？',
      text:`<b>${esc(date)}</b> 当前是 <b>${esc(statusText(cur).label)}</b>，要改成 <b>${newLabel}</b> 吗？<br/>
            <span style="color:#999;font-size:12px">确认后覆盖为「${newLabel}」，并标记为补打卡。</span>`,
      okText:'确认修改', showCancel:true
    });
    if(!ok){ $('supMask').classList.remove('show'); return; }
  }
  await punch(supStatus, true);
  $('supMask').classList.remove('show');
};

boot();
</script>
<footer class="app-footer" id="appFooter"></footer>

  $('appFooter').textContent = `团队打卡 ${VER} | 开发者: sea9413`;
</script>
</body>
